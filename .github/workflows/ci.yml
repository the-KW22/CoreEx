name: CI

on:
  pull_request:
    branches: [staging, main]
  # Runs on the merged result too, so the README badge for main shows a real status.
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Tests use Testcontainers (Docker is preinstalled on the runner) and rewrite openapi.json.
      - run: ./mvnw -B verify
      - name: Committed OpenAPI spec matches the code
        run: git diff --exit-code -- openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run generate
      - name: Generated client matches the spec
        run: git diff --exit-code -- lib/api/schema.d.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
