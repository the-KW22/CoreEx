name: Trash purge

# Calls the backend once a day so expired Trash is removed even when the free host has been asleep.
# Needs two repository secrets: PURGE_URL (https://<backend>.onrender.com) and PURGE_TOKEN (the same value as on Render).
# GitHub pauses scheduled workflows after 60 days without repository activity; run it by hand to wake it up again.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call the purge endpoint
        env:
          PURGE_URL: ${{ secrets.PURGE_URL }}
          PURGE_TOKEN: ${{ secrets.PURGE_TOKEN }}
        run: |
          if [ -z "$PURGE_URL" ] || [ -z "$PURGE_TOKEN" ]; then
            echo "Set the PURGE_URL and PURGE_TOKEN repository secrets." >&2
            exit 1
          fi
          # The backend may be asleep: the first request wakes it, which can take a minute, so retry.
          curl --fail-with-body --silent --show-error --retry 6 --retry-delay 20 --retry-all-errors \
            --max-time 120 -X POST -H "X-Purge-Token: $PURGE_TOKEN" "$PURGE_URL/internal/trash/purge"
