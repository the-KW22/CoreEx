spring.application.name=backend

# Local values live in .env (see .env.example); nothing secret is committed.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# All CoreEx tables live in their own schema: Supabase's REST API exposes everything in `public`
# (docs/adr/0005). Flyway creates the schema; every connection puts it first on its search path.
spring.flyway.schemas=coreex
# The search path puts CoreEx's schema first; "extensions" is where Supabase keeps extensions such as pg_trgm (a schema
# that does not exist, as in the tests, is simply skipped).
spring.datasource.hikari.connection-init-sql=set search_path = coreex, extensions

# Supabase Auth signs access tokens; the API verifies them with its public keys (no shared secret).
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_JWKS_URI}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPABASE_JWT_ISSUER}
spring.security.oauth2.resourceserver.jwt.jws-algorithms=ES256

# Browser origins allowed to call the API (comma separated): this environment's frontend only.
coreex.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Render and similar hosts tell the app which port to use.
server.port=${PORT:8080}

# This email signs in as the first Admin without an Invite (ADR 0004).
coreex.identity.owner-email=${OWNER_EMAIL}

# Import: a file over 1 MB gets its own "refused" result; Tomcat only rejects a file beyond this transport cap
# (and the whole request beyond the request cap) before the import code can answer per file.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=25MB

# Supabase Storage (REST API) for Assets. Empty by default: without them the Asset endpoints answer
# 503 STORAGE_UNAVAILABLE and nothing else is affected. The service key is a secret and stays in the backend.
# Lets a scheduler outside the backend start the Trash purge (header X-Purge-Token). Empty: that trigger does not exist.
coreex.trash.purge-token=${PURGE_TOKEN:}
coreex.storage.url=${STORAGE_URL:}
coreex.storage.service-key=${STORAGE_SERVICE_KEY:}
coreex.storage.bucket=${STORAGE_BUCKET:assets}
# Removing a User also deletes their Supabase sign-in (Auth admin API): the same secret key, and the auth URL is the
# token issuer ("https://<project>.supabase.co/auth/v1"), so no new variable is needed.
coreex.auth.url=${SUPABASE_JWT_ISSUER}
coreex.auth.service-key=${STORAGE_SERVICE_KEY:}

# Semantic search (ADR 0008): the `embed` Edge Function that turns text into vectors, and the secret only the API holds.
# Empty url or secret: embeddings are off, search stays exact-word, and nothing else is affected.
coreex.embeddings.url=${EMBED_URL:}
coreex.embeddings.secret=${EMBED_SECRET:}
# The sweep that keeps Notes embedded runs every minute (coreex.embeddings.sweep.interval), picks Notes unchanged for
# 2 minutes (settle) and sends at most 50 Chunks per run (max-chunks). Defaults live in SweepProperties.

# MCP server (ADR 0007): stateless Streamable HTTP at /mcp, so no per-instance session is lost when the free host sleeps.
# Access tokens guard it (McpSecurityConfig); the tools are in the mcp package.
spring.ai.mcp.server.name=coreex
spring.ai.mcp.server.protocol=STATELESS
spring.ai.mcp.server.instructions=CoreEx is the User's personal knowledge base: Notes written in Markdown and uploaded Assets, kept in Folders, grouped with Tags and connected with [[Links]]. Use search to find things by words, list_items and list_folders to browse, and get_item to read one. Anything in the Trash is hidden except from list_trash.

# Export streams a zip as an asynchronous request, which Tomcat cuts after 30 seconds unless told otherwise; a big
# account reads many files from Storage, so the zip gets longer.
spring.mvc.async.request-timeout=10m
