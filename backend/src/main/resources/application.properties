spring.application.name=backend

# Local values live in .env (see .env.example); nothing secret is committed.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# All CoreEx tables live in their own schema: Supabase's REST API exposes everything in `public`
# (docs/adr/0005). Flyway creates the schema; every connection uses it as its default.
spring.flyway.schemas=coreex
spring.datasource.hikari.schema=coreex

# Supabase Auth signs access tokens; the API verifies them with its public keys (no shared secret).
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_JWKS_URI}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPABASE_JWT_ISSUER}
spring.security.oauth2.resourceserver.jwt.jws-algorithms=ES256

# Browser origins allowed to call the API (comma separated): this environment's frontend only.
coreex.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Render and similar hosts tell the app which port to use.
server.port=${PORT:8080}

# This email signs in as the first Admin without an Invite (ADR 0004).
coreex.identity.owner-email=${OWNER_EMAIL}

# Supabase Storage (REST API) for Assets. Empty by default: without them the Asset endpoints answer
# 503 STORAGE_UNAVAILABLE and nothing else is affected. The service key is a secret and stays in the backend.
coreex.storage.url=${STORAGE_URL:}
coreex.storage.service-key=${STORAGE_SERVICE_KEY:}
coreex.storage.bucket=${STORAGE_BUCKET:assets}
